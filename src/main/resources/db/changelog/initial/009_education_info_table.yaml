databaseChangeLog:
  - changeSet:
      id: 09-created-education-info-table
      author: Feanor
      changes:
        - createTable:
            tableName: education_info
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: resume_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: institution
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: program
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: date
              - column:
                  name: degree
                  type: varchar(100)
                  constraints:
                    nullable: false