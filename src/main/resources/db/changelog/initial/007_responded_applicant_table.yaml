databaseChangeLog:
  - changeSet:
      id: 07-create-responded-applicants-table
      author: Feanor
      changes:
        - createTable:
            tableName: responded_applicants
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: resume_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: vacancy_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: confirmation
                  type: boolean