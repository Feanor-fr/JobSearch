databaseChangeLog:
  - changeSet:
      id: 08-created-messages-table
      author: Feanor
      changes:
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: responded_applicants
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: timestamp