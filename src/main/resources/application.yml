#spring.application.name=job_search

server:
  port: 8089

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: Job Search


#DB config
  datasource:
    url: jdbc:h2:./db/job;AUTO_SERVER=TRUE

    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.h2.Driver

  liquibase:
    change-log: classpath:/db/changelog/master.yaml

  jpa:
    hibernate:
      ddl-auto: validate


  mvc:
    static-path-pattern: /static/**
    log-request-details: true
  freemarker:
    expose-session-attributes: true

#Email
  mail:
    host: smtp.gmail.com
    username: ${EMAIL_SERVER_USERNAME}
    password: ${EMAIL_SERVER_PASSWORD}
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


#Logging
logging:
  level:
    root: info
    org:
      springframework:
        security: debug

# Формат вывода логов
#  pattern:
#    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

# Вывод логов в файл
  file:
    path: log


