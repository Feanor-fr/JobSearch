#spring.application.name=job_search

server:
  port: 8089

spring:
  application:
    name: Job Search


#DB config
  datasource:
    url: jdbc:h2:./db/job;AUTO_SERVER=TRUE

    username: feanor
    password: 1228
    driver-class-name: org.h2.Driver

  liquibase:
    change-log: classpath:/db/changelog/master.yaml

  mvc:
    static-path-pattern: /static/**
    log-request-details: true
  freemarker:
    expose-session-attributes: true

#Logging
logging:
  level:
    root: info
    org:
      springframework:
        security: debug

# Формат вывода логов
#  pattern:
#    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

# Вывод логов в файл
  file:
    path: log


